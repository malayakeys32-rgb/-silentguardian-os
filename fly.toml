# fly.toml — generated for SilentGuardianOS
# Run `fly launch` once to create the app, or `fly apps create silentguardian-os`
# then `fly deploy` using this config.

app = "silentguardian-os"
primary_region = "sjc"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
