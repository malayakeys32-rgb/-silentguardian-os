<title>Silent Guardian OS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:ital,wght@0,300;0,400;0,600;0,800;1,300&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  :root {
    --red: #e8161b;
    --red-glow: #ff2228;
    --red-dim: #8b0d10;
    --blue: #1a6cf5;
    --blue-glow: #3d8aff;
    --dark: #050810;
    --card: #090d1a;
    --border: rgba(232,22,27,0.25);
    --border-blue: rgba(26,108,245,0.3);
    --text: #e8ecf4;
    --muted: #5a6278;
    --dim: #9aa3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    overflow-x: hidden;
  }

  /* ── Scanline overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 500;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 40px;
    background: rgba(5,8,16,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    display: flex; align-items: center; gap: 12px;
  }

  .nav-shield {
    width: 36px; height: 36px;
    position: relative;
  }

  .nav-shield svg { width: 100%; height: 100%; }

  .nav-brand {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .nav-brand span { color: var(--red); }

  .nav-links {
    display: flex; align-items: center; gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: var(--dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--text); }

  .btn-access {
    background: var(--red);
    color: #fff;
    padding: 9px 22px;
    border: none;
    border-radius: 3px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
    text-decoration: none;
    display: inline-block;
  }

.btn-access::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .btn-access:hover { box-shadow: 0 0 20px rgba(232,22,27,0.6); }
  .btn-access:hover::before { opacity: 1; }

  .btn-outline {
    background: transparent;
    color: var(--text);
    padding: 9px 22px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 3px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: all 0.2s;
  }

  .btn-outline:hover {
    border-color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.05);
  }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    padding: 120px 40px 80px;
    position: relative;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 70% 50%, rgba(26,108,245,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 60%, rgba(232,22,27,0.1) 0%, transparent 50%),
      radial-gradient(ellipse 100% 100% at 50% 0%, rgba(232,22,27,0.05) 0%, transparent 40%);
  }

  /* Grid lines */
  .hero-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(232,22,27,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,22,27,0.06) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 100% 100% at 60% 50%, black 20%, transparent 70%);
  }

  /* City hologram */
  .hero-city {
    position: absolute;
    right: -40px; top: 50%;
    transform: translateY(-50%);
    width: 580px; height: 420px;
    opacity: 0.7;
  }

  .city-base {
    position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--red), var(--blue-glow), transparent);
    box-shadow: 0 0 30px var(--red), 0 0 60px rgba(232,22,27,0.4);
    animation: base-pulse 3s ease-in-out infinite;
  }

  @keyframes base-pulse {
    0%,100% { opacity: 0.8; }
    50% { opacity: 1; box-shadow: 0 0 50px var(--red), 0 0 100px rgba(232,22,27,0.5); }
  }

  .city-buildings {
    position: absolute; bottom: 3px; left: 0; right: 0;
    display: flex; align-items: flex-end; justify-content: center;
    gap: 4px; padding: 0 20px;
  }

  .building {
    flex-shrink: 0;
    border-radius: 1px 1px 0 0;
    position: relative;
    animation: bld-glow 4s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }

  .building::after {
    content: '';
    position: absolute; inset: 0;
    background: inherit;
    filter: blur(8px);
    opacity: 0.4;


  @keyframes bld-glow {
    0%,100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* Red buildings */
  .b1  { width:16px;height:120px;background:linear-gradient(180deg,#ff4444,#8b0d10);--d:0s; }
  .b2  { width:24px;height:200px;background:linear-gradient(180deg,#ff2228,#6b0a0d);--d:0.3s; }
  .b3  { width:14px;height:90px; background:linear-gradient(180deg,#e81618,#550809);--d:0.6s; }
  .b4  { width:30px;height:260px;background:linear-gradient(180deg,#ff3333,#7f1d1d);--d:0.9s; }
  .b5  { width:18px;height:160px;background:linear-gradient(180deg,#cc1a1a,#4a0607);--d:1.2s; }
  /* Blue/cyan buildings */
  .b6  { width:20px;height:180px;background:linear-gradient(180deg,#3d8aff,#0d2d6b);--d:0.4s; }
  .b7  { width:12px;height:100px;background:linear-gradient(180deg,#5599ff,#0a2050);--d:0.7s; }
  .b8  { width:28px;height:220px;background:linear-gradient(180deg,#1a6cf5,#0b1f4a);--d:1.0s; }
